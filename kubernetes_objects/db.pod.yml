apiVersion: v1
kind: Pod
metadata:
  name: postgres-db
  labels:
    app: postgres-db
spec:
  containers:
  - name: postgres
    image: postgres:15
    ports:
    - containerPort: 5432
    env:
    - name: POSTGRES_USER
      value: flaskuser
    - name: POSTGRES_PASSWORD
      value: flaskpass
    - name: POSTGRES_DB
      value: flaskdb

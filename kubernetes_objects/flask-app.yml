apiVersion: v1
kind: Pod
metadata:
  name: flask-app
  labels:
    app: flask-app
spec:
  containers:
  - name: flask-app
    image: signup
    imagePullPolicy: Never
    ports:
    - containerPort: 5000
    env:
    - name: DB_HOST
      value: postgres-service
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: flaskdb
    - name: DB_USER
      value: flaskuser
    - name: DB_PASSWORD
      value: flaskpass
